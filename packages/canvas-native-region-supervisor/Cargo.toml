[package]
name = "canvas-native-region-supervisor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded native region/tile backend prototype for Project Canvas"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.5"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.12"
