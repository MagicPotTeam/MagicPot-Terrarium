name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: The tag name to release
        type: string
        required: true
      release_name:
        description: The release name to release
        type: string
        required: true
      update_release_metadata:
        description: Whether to create or update the release metadata and assets.
        type: boolean
        default: true
      ref:
        description: The ref to release
        type: string
        default: 'refs/heads/master'

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    outputs:
      github_release_url: ${{ steps.publish_release.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/
            ~/AppData/Local/electron-builder/
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Cache embedded Python downloads
        uses: actions/cache@v4
        with:
          path: .cache/embedded-python
          key: ${{ runner.os }}-embedded-python-${{ hashFiles('scripts/prepare-embedded-python.mjs') }}
          restore-keys: |
            ${{ runner.os }}-embedded-python-

      - name: Set release asset timestamp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jobStartedAt = (Get-Date).ToUniversalTime().ToString('o')
          "MAGICPOT_RELEASE_JOB_STARTED_AT=$jobStartedAt" >> $env:GITHUB_ENV
          $timestamp = (Get-Date).ToUniversalTime().ToString('yyyyMMddTHHmmssZ')
          "MAGICPOT_RELEASE_TIMESTAMP=$timestamp" >> $env:GITHUB_ENV
          Write-Host "Release asset timestamp: $timestamp"

      - name: Build embedded package
        env:
          PIP_NO_CACHE_DIR: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          Get-PSDrive -Name C | Select-Object Name,Used,Free
          Write-Host '::group::Build embedded app'
          npm run build:embedded
          Write-Host '::endgroup::'
          Write-Host '::group::Prepare embedded runtime'
          npm run prepare:embedded
          Write-Host '::endgroup::'
          Write-Host '::group::Build image worker'
          npm run build:image-worker
          Write-Host '::endgroup::'
          $env:PACKAGE_MODE = 'embedded'
          # Keep electron-builder in package-only mode even when Actions exposes repository tokens.
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          npx electron-builder --config config/electron/electron-builder.config.js --win --x64 --publish never

          $portableRoot = Join-Path $PWD 'dist\embedded\win-unpacked\ComfyUI_windows_portable'
          $requiredPortableFiles = @(
            'advanced\run_nvidia_gpu_disable_api_nodes.bat',
            'update\current_requirements.txt',
            'update\update.py',
            'update\update_comfyui.bat',
            'update\update_comfyui_and_python_dependencies.bat',
            'update\update_comfyui_stable.bat',
            'run_cpu.bat',
            'run_nvidia_gpu.bat',
            'run_nvidia_gpu_fast_fp16_accumulation.bat'
          )
          $missingPortableFiles = @(
            $requiredPortableFiles | Where-Object {
              -not (Test-Path -LiteralPath (Join-Path $portableRoot $_) -PathType Leaf)
            }
          )
          if ($missingPortableFiles.Count -gt 0) {
            throw "Embedded package is missing required ComfyUI portable files: $($missingPortableFiles -join ', ')"
          }

      - name: Collect embedded build diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagnosticsDir = 'dist/embedded-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnosticsDir | Out-Null

          Get-PSDrive -Name C |
            Select-Object Name,Used,Free |
            Format-List |
            Out-File (Join-Path $diagnosticsDir 'disk-usage.txt')

          $requirementsManifest = '.staging/embedded/custom-node-requirements.json'
          if (Test-Path -LiteralPath $requirementsManifest) {
            Copy-Item -LiteralPath $requirementsManifest -Destination $diagnosticsDir
          }

          $constraints = '.staging/embedded/constraints.txt'
          if (Test-Path -LiteralPath $constraints) {
            Copy-Item -LiteralPath $constraints -Destination $diagnosticsDir
          }

          $python = '.staging/embedded/python_embeded/python.exe'
          if (Test-Path -LiteralPath $python) {
            & $python -s -m pip list --format=freeze 2>&1 |
              Out-File (Join-Path $diagnosticsDir 'pip-list.txt')
            $global:LASTEXITCODE = 0
            & $python -s -m pip check 2>&1 |
              Out-File (Join-Path $diagnosticsDir 'pip-check.txt')
            $global:LASTEXITCODE = 0
          }

      - name: Upload embedded build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: embedded-build-diagnostics
          path: dist/embedded-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Build pure package
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          npm run build:pure
          npm run build:image-worker
          $env:PACKAGE_MODE = 'pure'
          # Keep electron-builder in package-only mode even when Actions exposes repository tokens.
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          npx electron-builder --config config/electron/electron-builder.config.js --win --x64 --publish never

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $assetsDir = 'dist/release-assets'
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
          Get-ChildItem -LiteralPath $assetsDir -Force | Remove-Item -Force

          $embeddedArchives = @(
            Get-ChildItem -LiteralPath 'dist/embedded' -File |
              Where-Object { $_.Name -match '^magicpot-\d+\.\d+\.\d+-\d{8}T\d{6}Z-win\.7z$' }
          )
          if ($embeddedArchives.Count -ne 1) {
            throw "Expected exactly one embedded Windows .7z archive, found $($embeddedArchives.Count)"
          }

          $pureSetups = @(
            Get-ChildItem -LiteralPath 'dist/pure' -File |
              Where-Object { $_.Name -match '^magicpot-\d+\.\d+\.\d+-\d{8}T\d{6}Z-setup\.exe$' }
          )
          if ($pureSetups.Count -ne 1) {
            throw "Expected exactly one pure setup.exe, found $($pureSetups.Count)"
          }

          $releaseFiles = @($embeddedArchives[0], $pureSetups[0])
          [int64]$githubLimitBytes = [int64]2147483648

          foreach ($releaseFile in $releaseFiles) {
            if ($releaseFile.Length -ge $githubLimitBytes) {
              throw "Release asset exceeds GitHub's single-asset size limit: $($releaseFile.Name) is $($releaseFile.Length) bytes"
            }
            Copy-Item -LiteralPath $releaseFile.FullName -Destination (Join-Path $assetsDir $releaseFile.Name)
          }

          Get-ChildItem -LiteralPath $assetsDir | Select-Object Name,Length

      - name: Stage and verify Windows release
        id: stage_release
        if: ${{ inputs.update_release_metadata }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: release/${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_ASSET_DIR: dist/release-assets
          RELEASE_TIMESTAMP: ${{ env.MAGICPOT_RELEASE_TIMESTAMP }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/release/publish-release.mjs stage
          if ($LASTEXITCODE -ne 0) { throw "release staging failed with exit code $LASTEXITCODE" }

      - name: Upload assets to existing release
        id: retry_release
        if: ${{ !inputs.update_release_metadata }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: release/${{ inputs.tag_name }}
          RELEASE_ASSET_DIR: dist/release-assets
          RELEASE_TIMESTAMP: ${{ env.MAGICPOT_RELEASE_TIMESTAMP }}
          RELEASE_JOB_STARTED_AT: ${{ env.MAGICPOT_RELEASE_JOB_STARTED_AT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,body,assets,tagName,targetCommitish,id,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release) { throw "Existing release $env:RELEASE_TAG was not found" }
          if (-not $release.isDraft -or $release.isPrerelease) { throw 'Retry may only repair a draft, non-prerelease release' }
          if ($release.tagName -ne $env:RELEASE_TAG) { throw 'Existing release tag does not match requested tag' }
          if ($release.targetCommitish -and $release.targetCommitish -ne $env:GITHUB_SHA) { throw "Existing release target $($release.targetCommitish) does not match workflow SHA $env:GITHUB_SHA" }
          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $version = [string]$package.version
          $tagPattern = 'nightly-\d{8}-(\d+\.\d+\.\d+)$'
          if ($env:RELEASE_TAG -notmatch $tagPattern) { throw 'Retry release tag does not contain a stable SemVer' }
          if ($Matches[1] -ne $version) { throw "Retry release tag version $($Matches[1]) does not match package.json $version" }
          if ($env:RELEASE_TIMESTAMP -notmatch '^\d{8}T\d{6}Z$') { throw 'Release timestamp is invalid' }
          $expectedNames = @(
            "magicpot-$version-$env:RELEASE_TIMESTAMP-setup.exe",
            "magicpot-$version-$env:RELEASE_TIMESTAMP-win.7z"
          )
          $assets = @(Get-ChildItem -LiteralPath $env:RELEASE_ASSET_DIR -File | Sort-Object Name)
          if ($assets.Count -ne 2 -or (@($assets.Name | Where-Object { $_ -notin $expectedNames }).Count -ne 0)) { throw "Release assets must be exactly: $($expectedNames -join ', ')" }
          $existingNames = @($release.assets | ForEach-Object name)
          foreach ($existing in $existingNames) {
            if ($existing -notin $expectedNames) {
              gh release delete-asset $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY $existing --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove stale release asset $existing" }
            }
          }
          foreach ($asset in $assets) {
            gh release upload $env:RELEASE_TAG $asset.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release asset $($asset.Name)" }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish repaired release' }
          $published = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,assets,body | ConvertFrom-Json
          if ($published.isDraft -or $published.isPrerelease -or (($published.assets | Measure-Object).Count -ne 2)) { throw 'Repaired release failed final two-asset verification' }
          if ([string]$published.body -notmatch '<!-- magicpot-release: \{') { throw 'Existing release marker is missing' }
          "url=$($release.url)" >> $env:GITHUB_OUTPUT

      - name: Publish verified Windows release
        id: publish_release
        if: ${{ inputs.update_release_metadata }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: release/${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_ASSET_DIR: dist/release-assets
          RELEASE_TIMESTAMP: ${{ env.MAGICPOT_RELEASE_TIMESTAMP }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/release/publish-release.mjs publish
          if ($LASTEXITCODE -ne 0) { throw "release publication failed with exit code $LASTEXITCODE" }
