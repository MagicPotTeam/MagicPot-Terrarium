name: CI On Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'

permissions: {}

# New commits supersede only this PR's checks, never a release or manual run.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/call-ci.yml
    with:
      ref: ${{ github.ref }}
      fallback_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  build:
    permissions:
      contents: read
    uses: ./.github/workflows/call-build.yml
    with:
      ref: ${{ github.ref }}
      fallback_ref: ${{ github.event.pull_request.head.sha || github.sha }}
