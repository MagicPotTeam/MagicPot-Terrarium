name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: The ref to CI
        type: string
        default: 'refs/heads/master'
      release_candidate:
        description: Test the repository-owned release/nightly branch at the exact ref SHA
        type: boolean
        default: false
      fallback_ref:
        description: Fallback ref when the primary ref is unavailable
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      # Only pull_request contexts may check out an arbitrary PR ref. Default-branch
      # dispatch/schedule contexts use the event commit or a fixed owned release branch.
      - name: Resolve checkout ref
        if: github.event_name == 'pull_request'
        id: resolve-ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          FALLBACK_REF: ${{ inputs.fallback_ref }}
        run: |
          set -euo pipefail
          ref="$REQUESTED_REF"
          fallback_ref="$FALLBACK_REF"
          resolved_ref="$ref"

          if [[ -n "$fallback_ref" && "$ref" =~ ^refs/pull/[0-9]+/merge$ ]]; then
            repo_url="https://github.com/${{ github.repository }}.git"
            if ! git ls-remote --exit-code "$repo_url" "$ref" >/dev/null 2>&1; then
              echo "Merge ref $ref is unavailable; falling back to $fallback_ref"
              resolved_ref="$fallback_ref"
            fi
          fi

          echo "ref=$resolved_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pull request code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Checkout event commit
        if: github.event_name != 'pull_request' && !inputs.release_candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout owned release candidate
        if: github.event_name != 'pull_request' && inputs.release_candidate
        uses: actions/checkout@v4
        with:
          ref: refs/heads/release/nightly
          persist-credentials: false

      - name: Verify trusted checkout identity before executing repository code
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$RELEASE_CANDIDATE" == 'true' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/master' ]]
            [[ "$GITHUB_EVENT_NAME" == 'schedule' || "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
            [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]
            [[ "$actual" == "$REQUESTED_REF" ]]
          else
            [[ "$REQUESTED_REF" == "$GITHUB_REF" || "$REQUESTED_REF" == "$GITHUB_SHA" ]]
            [[ "$actual" == "$GITHUB_SHA" ]]
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: FIGPLUGIN host preparation regressions
        run: node --test scripts/prepare-figplugin-host.test.mjs

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Project Canvas benchmark smoke
        run: npm run test:project-canvas:benchmark-smoke

      - name: QA security posture
        run: npm run qa:security-posture
